# MyWorld —— 单 Worker 承载站点静态资源 + /api 读模型（D1）
# 站点本体与接口同域：/api/* 走 Worker，其余走 Static Assets（仓库根目录）
name = "myworld"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "."
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "myworld"
database_id = "de16c23c-dc6c-414c-9eb6-0cec46023879"
